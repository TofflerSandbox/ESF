<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --navy:#16233C;--navy2:#1F3050;--ink:#1C2434;--slate:#525B69;--slate2:#8A9099;
 --gold:#C9A961;--goldD:#8A6B25;--goldBg:#F7F0DF;--red:#9B1B2E;--redBg:#FAF0F1;
 --j68:#3A6FB0;--j68D:#27568F;--j68Bg:#EEF3FA;--spon:#2F7D5C;--sponBg:#EDF5F0;
 --paper:#F4F3EF;--card:#FFF;--line:#E2DFD6;--line2:#CFCBBF;
 --p0:#002060;--p1:#3F90CB;--p2:#3F90CB;--p3:#CE0F3E;--p4:#CE0F3E;--p5:#F9B018;--pt:#8A9099;
 --sans:'Public Sans',-apple-system,sans-serif;--mono:'IBM Plex Mono',monospace;--serif:'Libre Caslon Text',Georgia,serif;
}
body{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper)}
a{color:var(--j68D);text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--goldD);outline-offset:2px;border-radius:2px}
.mark{background:var(--red);color:#fff;text-align:center;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 10px;text-transform:uppercase}
/* top bar */
#top{background:var(--navy);color:#fff;padding:10px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
#top .brand{display:flex;align-items:baseline;gap:10px}
#top .brand b{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
#top .brand b span{color:var(--gold)}
#top .brand small{font-family:var(--mono);font-size:9.5px;color:#93A0B8;letter-spacing:.18em}
#top nav{display:flex;gap:4px;margin-left:8px}
#top nav a{color:#B9C2D2;padding:7px 13px;border-radius:6px;font-weight:600;font-size:13px}
#top nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
#top nav a.on{color:var(--navy);background:var(--gold)}
#top .proto{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--gold);border:1px solid var(--goldD);padding:4px 10px;border-radius:4px}
main{max-width:90vw;margin:0 auto;padding:20px 22px 60px}
h2.vt{font-family:var(--serif);font-size:24px;color:var(--navy);margin:6px 0 2px}
.vsub{color:var(--slate);font-size:13px;margin-bottom:16px}
/* cards & chips */
.card{background:var(--card);border:1px solid var(--line);border-radius:9px}
.chd{padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--slate);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cbd{padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip i{font-style:normal;width:7px;height:7px;border-radius:50%;display:inline-block}
.mono{font-family:var(--mono)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px 16px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--navy)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
svg text{font-family:var(--sans)}
/* alerts */
.alert-row{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:flex-start;cursor:pointer}
.alert-row:last-child{border-bottom:none}

.alert-row .tag{flex-shrink:0;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:1px}

#board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start;padding-bottom:8px}
@media(max-width:1080px){#board{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:640px){#board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{min-width:0;background:#EDEBE4;border:1px solid var(--line);border-radius:9px}
.col .colh{padding:8px 10px;border-bottom:1px solid var(--line2)}
.col .colh .t{font-size:11.5px;font-weight:800;color:var(--navy);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.col .colh .s{font-family:var(--mono);font-size:10px;color:var(--slate)}

.pcard{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:7px 9px;cursor:pointer}
.pcard:hover{box-shadow:0 2px 8px rgba(22,35,60,.12)}

.pcard .nm{font-size:12px;font-weight:600;color:var(--navy);line-height:1.3;margin:2px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .mt{display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap;font-size:10px;color:var(--slate2)}
.pcard .mt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* table */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px}
.fbar input[type=search]{flex:1;min-width:180px;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font:inherit}
.fbar select{border:1px solid var(--line2);border-radius:6px;padding:7px 8px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
.fbar .cnt{font-family:var(--mono);font-size:11px;color:var(--slate);margin-left:auto}

table.list th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate2);text-align:left;padding:9px 12px;background:#EDEBE4;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.list td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover{background:var(--goldBg)}
table.list tr:last-child td{border-bottom:none}
.money{font-family:var(--mono);font-size:11.5px;font-weight:600}
/* record */
.bk{font-size:12.5px;font-weight:600;color:var(--slate)}
.rhead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap;margin:8px 0 14px}
.rhead h2{font-family:var(--serif);font-size:25px;color:var(--navy);line-height:1.2;max-width:760px}
.rhead .code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--goldD);letter-spacing:.08em}
.btn{background:var(--navy);color:var(--gold);border:none;border-radius:7px;padding:10px 16px;font-weight:700;font-size:13px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line2)}
.rgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;align-items:start}
@media(max-width:980px){.rgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--slate2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding-top:2px}
.kv dd{color:var(--ink)}
.crit{display:flex;gap:10px;padding:9px 12px;border-radius:7px;align-items:flex-start;border:1px solid transparent}
.crit+.crit{margin-top:4px}
.crit .st{flex-shrink:0;font-family:var(--mono);font-size:9px;font-weight:700;padding:2.5px 8px;border-radius:4px;margin-top:1px;letter-spacing:.06em}
.crit.hard{background:var(--goldBg);border-color:#E4D3A6}
.crit .tx{font-size:12.5px;line-height:1.45;color:var(--slate)}
.crit .tx b{color:var(--navy);display:block}
.hardtag{font-family:var(--mono);font-size:8.5px;color:var(--goldD);border:1px solid var(--gold);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:1px}
.gh-tbl{width:100%;border-collapse:collapse;font-size:12px}
.gh-tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--slate2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.gh-tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gh-tbl tr:last-child td{border-bottom:none}
.tl{list-style:none}
.tl li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.tl li:last-child{border-bottom:none}
.tl .d{font-family:var(--mono);font-size:10.5px;color:var(--slate2);flex-shrink:0;width:74px;padding-top:1px}
.banner{border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:14px;border:1px solid}
/* brief */
#v-brief{background:#fff;border:1px solid var(--line);border-radius:10px;max-width:980px;margin:0 auto;padding:0 0 26px}
.bf-pad{padding:0 44px}
.bf-sec{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--goldD);margin:26px 0 8px;text-transform:uppercase}
.bf-box{border:1px solid #D9C58E;background:var(--goldBg);border-radius:7px;padding:13px 16px;font-size:13px}
.sigrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.sig{border:1px solid var(--line2);border-radius:8px;padding:14px 16px}
.sig .ln{border-bottom:1px solid var(--slate);height:30px;margin-top:18px}
.sig small{color:var(--slate2);font-size:10px}
@media print{
 #top,.mark.no-print,#bf-actions,.bk{display:none!important}
 body{background:#fff}main{padding:0;max-width:none}
 #v-brief{border:none;border-radius:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.hide{display:none!important}

<script>
/* ============ reference data (from the ESF / spec §6) ============ */
const PH_COL=['#002060','#3F90CB','#3F90CB','#CE0F3E','#CE0F3E','#F9B018'];   // placemat palette (2026 Roundtable)
const PH_TXT=['#002060','#2E7CB7','#2E7CB7','#B30D36','#B30D36','#B07607'];   // darkened for text contrast
const PH_NAME=['Stage 0 · Intake','Phase I · Feasibility','Phase II · Prototype','Phase III · Ltd Deployment','Phase IV · Transition','Stage 5 · At Scale'];
const PH_SHORT=['Stage 0','Phase I','Phase II','Phase III','Phase IV','Stage 5'];
const DESIGN_MONTHS=[[0.7,1],[3,6],[18,24],[12,24],[12,18],[0,0]];
const CRITERIA={
 0:[{t:'Co-sponsor named (signed LOI)',hard:1},{t:'Problem statement scoped'},{t:'Value path declared'},{t:'ROM estimate provided'},{t:'No disqualifying duplication'}],
 1:[{t:'JHU-APL TRA fully satisfactory (5/5)',hard:1},{t:'Value hypothesis validated on DLA data'},{t:'CONOPS operationally realistic'},{t:'Final S&T report delivered'},{t:'Co-sponsor reaffirms commitment'}],
 2:[{t:'PRR passed (SRR→PRR complete)'},{t:'J8 Finance ROI certification in writing',hard:1},{t:'Transition path formally declared'},{t:'Co-sponsor written reaffirmation'},{t:'Contracting, Finance, RM, J6 on record'}],
 3:[{t:'Signed funding commitment — SES level',hard:1},{t:'Multi-site deployment with real users (≥2)'},{t:'J6 ATO plan approved'},{t:'J6 sandbox connectivity established'},{t:'OGC/J7 bridge eligibility documented'}],
 4:[{t:'Operational owner formal acceptance'},{t:'J7 contract closeout / novation confirmed',hard:1},{t:'Funding mechanism active'},{t:'Performance review schedule established'},{t:'Lessons learned documented'}]};
const VP={REVENUE:{l:'↑ Revenue',c:'#2F7D5C'},RISK:{l:'↓ Risk',c:'#8A6B25'},COST:{l:'↓ Cost',c:'#27568F'},PERFORMANCE:{l:'↑ Performance',c:'#16233C'}};
const PROG=[
 {c:'AMTR',n:'Acquisition Modernization Technology Research',f:'LogTech'},
 {c:'ERP',n:'Energy Readiness Program',f:'LogTech'},
 {c:'SDD',n:'Strategic Distribution & Disposition',f:'LogTech'},
 {c:'SCM-S',n:'Supply Chain Management — Sustainability',f:'LogTech'},
 {c:'LTR',n:'Logistics Technology Research',f:'LogTech'},
 {c:'AME',n:'Advanced Microcircuit Emulation',f:'ManTech'},
 {c:'BATTNET',n:'Battery Network',f:'ManTech'},
 {c:'AM',n:'Additive Manufacturing',f:'ManTech'},
 {c:'CASTING',n:'Casting',f:'ManTech'},
 {c:'FORGING',n:'Forging',f:'ManTech'},
 {c:'DLIR',n:'Defense Logistics Information Research',f:'ManTech'},
 {c:'MUST',n:'Military Unique Sustainment Technology',f:'ManTech'},
 {c:'SUBNET',n:'Subsistence Network',f:'ManTech'},
 {c:'ARTET',n:'Applied Research & Testing Emergent Technologies',f:'ManTech'},
 {c:'SBIP SM',n:'Small Business Innovation Program — Strategic Materials',f:'SBIP'}];
const PROGMAP=Object.fromEntries(PROG.map(p=>[p.c,p]));
const FAMC={LogTech:'#27568F',ManTech:'#8A6B25',SBIP:'#2F7D5C'};
function assignProgram(tech,dom){
  if(rnd()<0.06)return 'ARTET';
  if(rnd()<0.05)return 'SBIP SM';
  if(tech==='Additive Manufacturing')return 'AM';
  if(/Fuel|Energy/i.test(dom)||/Energy/i.test(tech))return 'ERP';
  if(/Subsistence/i.test(dom))return 'SUBNET';
  if(/Disposition|Depot|Distribution|Kitting/i.test(dom)||/Robotics|Autonomous|ITV|Cold Chain/i.test(tech))return pick(['SDD','SDD','LTR','SCM-S','AMTR']);
  if(/Document AI|Demand Forecasting|Digital Twin/i.test(tech))return pick(['DLIR','AMTR','LTR']);
  if(/Counterfeit|Blockchain/i.test(tech))return pick(['LTR','DLIR']);
  if(/Wearable/i.test(tech))return 'MUST';
  if(/Cyber|Computer Vision|Predictive/i.test(tech))return 'LTR';
  return pick(['LTR','SCM-S','AMTR','DLIR','AME','BATTNET','CASTING','FORGING','AM','MUST']);
}
const SPONSORS=['DLA Troop Support','DLA Distribution','DLA Aviation','DLA Land & Maritime','DLA Energy','DLA Disposition Services','DLA Logistics Ops (J3)','DLA Information Ops (J6)'];
const CLASSES=['I','II','III','IIIP','IV','V','VII','VIII','IX'];
const TECHS=['ITV / RFID','Additive Manufacturing','Predictive Maintenance','Demand Forecasting AI','Warehouse Robotics','Counterfeit Detection','Computer Vision Inspection','Digital Twin','Autonomous Ground Vehicles','Cold Chain Monitoring','Document AI / NLP','Energy Resilience','Wearable Telemetry','Edge Cybersecurity','Blockchain Provenance'];
const DOMAINS=['Class IX Consumables','Depot Operations','Bulk Fuel Distribution','Subsistence Cold Chain','Medical Materiel','Construction & Barrier Materiel','Aviation Spares','Maritime Spares','Disposition Workflows','Order Fulfillment','Supplier Risk','Theater Distribution','Kitting Operations','Packaging & Preservation','Demand Planning'];
const FN=['A. Brooks','M. Okafor','J. Alvarez','S. Whitfield','D. Nakamura','R. Castellanos','K. Donnelly','P. Venkataraman','L. Mercer','T. Osei','C. Lindqvist','H. Barrow','N. Petrov','G. Marchetti','E. Stanton','F. Adeyemi','W. Kowalski','B. Tran','V. Ramos','J. McAllister'];
const SES=['SES R. Hollings','SES M. Vance','SES D. Achebe','SES K. Brandt','SES L. Otero','SES T. Maddox','SES P. Iyer','SES C. Rowe'];

/* ============ seeded generator ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260612);
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const rf=(a,b)=>rnd()*(b-a)+a;
const NOW=new Date(2026,5,12);
const addM=(d,m)=>{const x=new Date(d);x.setDate(1);x.setMonth(x.getMonth()+Math.floor(m));x.setDate(Math.min(28,3+Math.floor((m%1)*25)));return x};
const fmt=d=>d?d.toISOString().slice(0,10):'—';
const fmtMY=d=>d?d.toLocaleDateString('en-US',{month:'short',year:'numeric'}):'—';
const FY=d=>d.getMonth()>=9?d.getFullYear()+1:d.getFullYear();
const $k=v=>v>=1e6?('$'+(v/1e6).toFixed(2)+'M'):('$'+Math.round(v/1e3)+'K');
const monthsBetween=(a,b)=>(b-a)/2629800000;

const PROJECTS=[];
function makeValueCases(dom,tech,rom,reach){
  const mk={
    REVENUE:()=>{const m=pick(['WCF sales recovery','disposition proceeds','reutilization value']);
      const base=rf(1.5,6)*1e6, pct=rf(6,18), ann=base*pct/100;
      return {metric:m,base:$k(base)+'/yr',proj:$k(base+ann)+'/yr',annual:ann,
        arg:'Grows '+m+' in '+dom.toLowerCase()+': better data quality raises recoverable value across the enterprise; projected +'+$k(ann)+'/yr ('+pct.toFixed(0)+'% lift) against the documented Stage 0 baseline.'};},
    COST:()=>{const m=pick(['inventory carrying cost','expedited transport spend','manual processing labor']);
      const base=rf(1.2,7)*1e6, pct=rf(8,25), ann=base*pct/100;
      return {metric:m,base:$k(base)+'/yr',proj:$k(base-ann)+'/yr',annual:ann,
        arg:'Cuts '+m+' in '+dom.toLowerCase()+': '+tech.toLowerCase()+' removes manual touchpoints and rework; projected '+$k(ann)+'/yr savings ('+pct.toFixed(0)+'% reduction) vs. baseline.'};},
    RISK:()=>{const m=pick(['loss & diversion exposure','supply disruption exposure','counterfeit escape risk']);
      const ann=rf(0.3,2)*1e6;
      return {metric:m,base:'expected loss '+$k(ann*rf(1.4,2.4))+'/yr',proj:'expected loss '+$k(ann*rf(0.2,0.5))+'/yr',annual:ann,
        arg:'Buys down '+m+' in '+dom.toLowerCase()+': continuous '+tech.toLowerCase()+' coverage replaces episodic manual checks; expected avoided loss '+$k(ann)+'/yr vs. the Stage 0 baseline.'};},
    PERFORMANCE:()=>{const m=pick(['order fill rate','asset visibility','materiel availability']);
      const base=rf(58,86), proj=Math.min(98,base+rf(5,18)), ann=rf(0.2,1.2)*1e6;
      return {metric:m,base:base.toFixed(0)+'%',proj:proj.toFixed(0)+'%',annual:ann,
        arg:'Raises '+m+' in '+dom.toLowerCase()+' from '+base.toFixed(0)+'% to '+proj.toFixed(0)+'%: a readiness gain monetized conservatively at '+$k(ann)+'/yr in avoided workarounds.'};}};
  const keys=Object.keys(VP);const p1=pick(keys);
  const vps=[{path:p1,primary:true,...mk[p1]()}];
  if(rnd()<0.32){let p2=pick(keys.filter(k=>k!==p1));vps.push({path:p2,primary:false,...mk[p2]()});}
  const totalAnnual=vps.reduce((a,v)=>a+v.annual,0);
  const roi=Math.max(1.1,Math.min(8.5,(totalAnnual*5)/rom));
  return {vps,roi,certified:reach>=2};
}
function makeProject(fate){ // fate: {kind:'active',phase} | {kind:'sunset',gate} | {kind:'descope'} | {kind:'scale'}
  const tech=pick(TECHS), dom=pick(DOMAINS);
  const name=tech+' for '+dom;

function locator(p,w){ // mini locator svg
  w=w||230;const segW=(w-30)/6,h=10,y=6;let g='';

function barChartSVG(items,{w=560,h=190,fmt=v=>v,grid=true}={}){ // items:[{l,v,c,sub}]
  const max=Math.max(...items.map(i=>i.v),1),pad=28,bw=(w-pad)/items.length;

/* table view with filters */
const FILT={q:'',phase:'',status:'',port:'',spon:'',vp:'',cls:''};
let SORT={k:'code',dir:1};
function applyFilters(){
  return PROJECTS.filter(p=>{
    if(FILT.q){const q=FILT.q.toLowerCase();if(!(p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||p.nsn.some(n=>n.toLowerCase().includes(q))||p.tech.some(t=>t.toLowerCase().includes(q))))return false;}
    if(FILT.phase!==''&&String(p.status==='AT_SCALE'?5:p.curPhase)!==FILT.phase)return false;
    if(FILT.status&&p.status!==FILT.status)return false;
    if(FILT.port&&p.portfolio!==FILT.port)return false;
    if(FILT.spon&&!p.sponsors.includes(FILT.spon))return false;
    if(FILT.vp&&!p.vps.some(v=>v.path===FILT.vp))return false;
    if(FILT.cls&&!p.cls.includes(FILT.cls))return false;
    return true;});
}
function setF(k,v){FILT[k]=v;renderList();}
function setSort(k){SORT=SORT.k===k?{k,dir:-SORT.dir}:{k,dir:1};renderList();}
function renderList(){
  const rows=applyFilters().slice().sort((a,b)=>{
    const key=p=>SORT.k==='spend'?j68Spend(p):SORT.k==='entry'?p.entry:SORT.k==='vp'?p.vp:p.code;
    const va=key(a), vb=key(b);
    return (va>vb?1:va<vb?-1:0)*SORT.dir;});

  document.getElementById('v-list').innerHTML=`
  <h2 class="vt">Projects</h2><div class="vsub">Every project of record — filter by phase, sponsor, portfolio, value path, class of supply, or search names, codes, technologies, and NSNs.</div>
  <div class="fbar">
    <input type="search" placeholder="Search name, code, NSN, technology…" value="${esc(FILT.q)}" oninput="setF('q',this.value)">
    <select onchange="setF('phase',this.value)"><option value="">Phase: all</option>${[0,1,2,3,4,5].map(i=>`<option value="${i}" ${FILT.phase===String(i)?'selected':''}>${PH_SHORT[i]}</option>`).join('')}</select>
    <select onchange="setF('status',this.value)"><option value="">Status: all</option>${opt(['ACTIVE','HOLD','AT_SCALE','SUNSET','DESCOPED'],FILT.status)}</select>
    <select onchange="setF('port',this.value)"><option value="">Program: all</option>${['LogTech','ManTech','SBIP'].map(f=>`<optgroup label="${f}">${PROG.filter(x=>x.f===f).map(x=>`<option value="${x.c}" ${FILT.port===x.c?'selected':''}>${x.c} — ${x.n.length>34?x.n.slice(0,34)+'…':x.n}</option>`).join('')}</optgroup>`).join('')}</select>
    <select onchange="setF('spon',this.value)"><option value="">Sponsor: all</option>${opt(SPONSORS,FILT.spon)}</select>
    <select onchange="setF('vp',this.value)"><option value="">Value path: all</option>${opt(Object.keys(VP),FILT.vp)}</select>
    <select onchange="setF('cls',this.value)"><option value="">Class: all</option>${opt(CLASSES,FILT.cls)}</select>
    <button onclick="Object.keys(FILT).forEach(k=>FILT[k]='');renderList()">Clear</button>
    <span class="cnt">${rows.length} / ${PROJECTS.length}</span>
  </div>
  <div style="overflow-x:auto"><table class="list"><thead><tr>
    <th onclick="setSort('code')">Code ${SORT.k==='code'?(SORT.dir>0?'▲':'▼'):''}</th><th>Project</th><th>Phase</th><th>Sponsor(s)</th><th>Program</th><th onclick="setSort('vp')">Value path ${SORT.k==='vp'?(SORT.dir>0?'▲':'▼'):''}</th><th onclick="setSort('spend')">J68 to date ${SORT.k==='spend'?(SORT.dir>0?'▲':'▼'):''}</th><th onclick="setSort('entry')">Entered ${SORT.k==='entry'?(SORT.dir>0?'▲':'▼'):''}</th>
  </tr></thead><tbody>
  ${rows.map(p=>`<tr onclick="location.hash='#/p/${p.code}'">
    <td class="mono" style="font-weight:700;color:var(--goldD)">${p.code}</td>
    <td style="font-weight:600;color:var(--navy);max-width:330px">${esc(p.name)}</td>
    <td>${phaseChip(p)}</td>
    <td style="font-size:11.5px;color:var(--slate)">${esc(p.sponsors.map(s=>s.replace('DLA ','')).join(' · '))}</td>
    <td><span class="chip" title="${PROGMAP[p.portfolio].n} (${PROGMAP[p.portfolio].f})" style="background:${FAMC[PROGMAP[p.portfolio].f]}12;color:${FAMC[PROGMAP[p.portfolio].f]}">${p.portfolio}</span></td>
    <td>${p.vps.map(v=>`<span class="chip" title="${v.primary?'Primary':'Secondary'} value path" style="background:${VP[v.path].c}12;color:${VP[v.path].c};font-size:10.5px;margin:1px 2px 1px 0">${VP[v.path].l}${v.primary&&p.vps.length>1?' ●':''}</span>`).join('')}</td>
    <td class="money">${$k(j68Spend(p))}</td>
    <td class="mono" style="font-size:11px;color:var(--slate)">${fmtMY(p.entry)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

      <span class="st" style="${c.status==='MET'?'background:var(--sponBg);color:var(--spon)':'background:var(--goldBg);color:var(--goldD)'}">${c.status}</span>
      <span class="tx"><b>${i+1}. ${esc(c.t)}${c.hard?'<span class="hardtag">NON-WAIVABLE</span>':''}</b></span></div>`).join('')}`:''}
    <div class="bf-sec">Funding summary</div>
    <table class="gh-tbl"><thead><tr><th>FY</th><th>APPROPRIATION</th><th>SOURCE</th><th>AMOUNT</th></tr></thead><tbody>
      ${p.fund.map(f=>`<tr><td class="mono">FY${String(f.fy).slice(2)}</td><td>${f.app}</td><td>${f.src}</td><td class="money">${$k(f.amt)}</td></tr>`).join('')||'<tr><td colspan=4>None obligated.</td></tr>'}
    </tbody></table>
    <div class="bf-sec">Transition pathway${p.paths.length>1?'s':''}</div>
    ${p.paths.map(x=>`<div style="font-size:13px;margin-bottom:4px"><b>Path ${x.path}.</b> ${esc(x.mech)} — <i>${x.status}</i>${x.committed?', committed '+x.committed:''}.</div>`).join('')}
    ${(p.status==='ACTIVE'||p.status==='HOLD')&&g===3?`
    <div class="bf-sec">Commitment instrument — signatures required</div>
    <div style="font-size:12.5px;color:var(--slate);margin-bottom:6px"><i>"We plan to commit" is not Gate 3 passage. Both signatures are SES/GOFO and non-delegable (lifecycle rule R5).</i></div>
    <div class="sigrow">
      <div class="sig"><b style="font-size:12px;color:var(--goldD)">J68 R&D DIVISION</b><div class="ln"></div><small>Signature — SES/GOFO · non-delegable · Date</small></div>
      <div class="sig"><b style="font-size:12px;color:var(--goldD)">SPONSOR — ${esc(p.sponsors.join(' / ').toUpperCase())}</b><div class="ln"></div><small>Signature — SES/GOFO · non-delegable · Date</small></div>
    </div>`:''}
    <div style="margin-top:22px;font-size:10.5px;color:var(--slate2);font-style:italic">Generated by ESH from the project record — every line above traces to a field in the data model. Synthetic prototype data.</div>
  </div>`;
}
/* ============ router ============ */
function route(){
  const h=location.hash.replace(/^#\/?/,'');
  const views=['v-dash','v-board','v-list','v-rec','v-brief'];
  views.forEach(v=>document.getElementById(v).classList.add('hide'));
  let key='dash';
  if(h==='board'){key='board';renderBoard();document.getElementById('v-board').classList.remove('hide');}
  else if(h==='projects'){key='list';renderList();document.getElementById('v-list').classList.remove('hide');}
  else if(h.startsWith('p/')){key='';renderRecord(h.slice(2));document.getElementById('v-rec').classList.remove('hide');}
  else if(h.startsWith('brief/')){key='';renderBrief(h.slice(6));document.getElementById('v-brief').classList.remove('hide');}
  else{renderDash();document.getElementById('v-dash').classList.remove('hide');}
  document.querySelectorAll('#top nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===key));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
